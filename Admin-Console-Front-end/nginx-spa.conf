# Service statique de la SPA (dist/) avec fallback routeur cote client.
# Ce Nginx tourne DANS le conteneur frontend ; il ecoute sur 3000 et est
# proxifie par le proxy central (nginx-proxy-central) via le reseau proxy-network.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression basique
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Cache long pour les assets fingerprintes par Vite
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /runtime-config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
