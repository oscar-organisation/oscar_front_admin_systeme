# Configuration Alembic - Console Admin OSCAR.
#
# Lot 0 : infra Alembic + baseline autogeneree depuis les modeles ACTUELS.
# create_all reste actif dans app/main.py (le cutover se fera au Lot 1).
# L'URL SQLAlchemy est lue depuis app.config.settings (env-driven), pas ici.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url est defini dynamiquement dans alembic/env.py depuis la config
# de l'application (variable d'environnement DATABASE_URL). Ne rien mettre en dur.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
